<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF6D6" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A" />
      <stop offset="100%" stop-color="#090909" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <rect width="100" height="100" rx="28" fill="url(#darkBg)" stroke="url(#gold)" stroke-width="3" />

  <!-- Outer Ring Accent -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.6" />

  <!-- Museum Columns Emblem -->
  <!-- Roof / Pediment -->
  <polygon points="50,22 25,36 75,36" fill="url(#gold)" />
  
  <!-- Architrave Line -->
  <rect x="25" y="38" width="50" height="3" fill="url(#gold)" rx="1" />

  <!-- 4 Pillars -->
  <rect x="28" y="44" width="6" height="26" fill="url(#gold)" rx="1" />
  <rect x="42" y="44" width="6" height="26" fill="url(#gold)" rx="1" />
  <rect x="52" y="44" width="6" height="26" fill="url(#gold)" rx="1" />
  <rect x="66" y="44" width="6" height="26" fill="url(#gold)" rx="1" />

  <!-- Base Steps -->
  <rect x="22" y="72" width="56" height="4" fill="url(#gold)" rx="1" />
  <rect x="18" y="78" width="64" height="4" fill="url(#gold)" rx="1" />

  <!-- Center Shining Star -->
  <path d="M50 25 L52 30 L57 30 L53 33 L55 38 L50 35 L45 38 L47 33 L43 30 L48 30 Z" fill="#FFF" />
</svg>
